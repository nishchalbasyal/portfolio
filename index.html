<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/portfolio/favicon.ico" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Nishchal Basyal Portfolio. Personal Website" />
    <link rel="apple-touch-icon" href="/portfolio/logo192.png" />
    <link rel="manifest" href="/portfolio/manifest.json" />
    <title>Updated portfolio available | Nishchal Basyal</title>
    <script>
        (() => {
            const redirectUrl = "https://nishchalbasyal.github.io/";
            const tickerMessage = "New version of this portfolio available.";

            const injectUi = () => {
                const style = document.createElement("style");
                style.textContent = `
                    body {
                        padding-top: 104px !important;
                    }

                    #portfolio-news-ticker {
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        z-index: 2147483647;
                        overflow: hidden;
                        background: #d60000;
                        color: #fff;
                        font: 700 14px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                        letter-spacing: 0.04em;
                        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
                    }

                    #portfolio-news-ticker .ticker-track {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        width: 100%;
                        min-height: 56px;
                        white-space: normal;
                        text-align: center;
                        text-decoration: none;
                        color: #fff;
                    }

                    #portfolio-news-ticker .ticker-item {
                        flex: 0 1 auto;
                        padding: 0 0.25rem;
                    }

                    @media (max-width: 640px) {
                        body {
                            padding-top: 118px !important;
                        }

                        #portfolio-news-ticker .ticker-track {
                            min-height: 64px;
                            font-size: 13px;
                            line-height: 1.45;
                            padding: 0.5rem 0.75rem;
                        }
                    }
                `;
                document.head.appendChild(style);

                const ticker = document.createElement("div");
                ticker.id = "portfolio-news-ticker";
                ticker.innerHTML = `
                    <a class="ticker-track" href="${redirectUrl}" aria-label="New version of this portfolio available. Click here to open the new portfolio.">
                        <span class="ticker-item">${tickerMessage}</span>
                        <span class="ticker-item"><strong><u>Click Here</u></strong></span>
                        <span class="ticker-item">to open the new portfolio</span>
                    </a>
                `;
                document.body.appendChild(ticker);

                const banner = document.createElement("div");
                banner.style.cssText = [
                    "position:fixed",
                    "top:56px",
                    "left:50%",
                    "transform:translateX(-50%)",
                    "z-index:2147483646",
                    "max-width:min(92vw,720px)",
                    "padding:14px 18px",
                    "border-radius:14px",
                    "background:rgba(15, 23, 42, 0.92)",
                    "color:#fff",
                    "font:600 14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif",
                    "box-shadow:0 12px 40px rgba(0,0,0,.28)",
                    "backdrop-filter:blur(10px)",
                    "text-align:center"
                ].join(";");

                banner.innerHTML = '<div style="font-size:15px;margin-bottom:4px;">Updated portfolio available.</div><div style="font-weight:500;opacity:.92;"><a href="https://nishchalbasyal.github.io/" style="color:#93c5fd;text-decoration:underline;">Click here to open the new portfolio</a>.</div>';
                document.body.appendChild(banner);
            };

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", injectUi, { once: true });
            } else {
                injectUi();
            }
        })();
    </script>
    <script defer="defer" src="/portfolio/static/js/main.63139e80.js"></script>
    <link href="/portfolio/static/css/main.79406316.css" rel="stylesheet">
</head>

<body><noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>

</html>
